# ============================================================
# 州民中飞跃手册 - 学校结构化元数据
#
# 此文件需手动维护(不被 sync.py 覆盖)。
# generate.py 读取该文件,在每个学校专属页注入"学校信息卡"。
#
# 字段说明:
#   official: 学校官网 URL(留空字符串则不渲染该行)
#   city:     所在城市(任意自然语言,如 "北京"/"湘西吉首"/"墨尔本")
#   type:     标签数组,如 ["985", "211", "双一流"];会渲染成 chip
#
# 数据来源说明:
#   官网/城市/类型 均为公开稳定信息,由初始填充时基于通识知识录入。
#   标记 "# 待核实" 的请优先校对;official 留空表示未确认,
#   后续可手动补全后重跑 generate.py 即可生效。
# ============================================================

